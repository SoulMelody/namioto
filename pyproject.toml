[project]
name = "namioto"
version = "0.1.0"
description = "A WaveTone-style MIDI editor with spectrum assisted transcription"
readme = "README.md"
requires-python = ">=3.12"
license = "AGPL-3.0-only"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "sitiyou" }]
dependencies = [
    "lark>=1.3.1",
    "librosa>=1.0",
    "mido>=1.3.3",
    "platformdirs>=4.14.0",
    "pyside6-essentials>=6.12.0",
    "python-rtmidi>=1.5.8",
    "qtawesome>=1.4.2",
    "scipy>=1.18.1",
]

# the runtime the analysis jobs open a model with. `cpu` and `webgpu` share the plain `onnxruntime`
# build, the WebGPU device being a plugin execution provider on top of it, while `cuda` is a build of
# its own; that build provides the same `onnxruntime` module, so it conflicts with both
[project.optional-dependencies]
cpu = ["onnxruntime>=1.20"]
cuda = ["onnxruntime-gpu>=1.20"]
webgpu = ["onnxruntime>=1.24.4", "onnxruntime-ep-webgpu"]

[project.scripts]
namioto = "namioto.ui.app:main"
namioto-ctl = "namioto.ipc:main"
namioto-cli = "namioto.cli:main"

[dependency-groups]
# the analysis jobs need one of the onnxruntime builds and the tests exercise them, but no default
# group may carry one: `uv sync` always includes it, so `--extra cuda`/`webgpu` would install a second
# build over it. Development picks its build with `--extra cpu` (or `--extra cuda`/`--extra webgpu`)
# the build tools are here because build isolation is disabled for namioto (see tool.uv)
dev = ["pytest>=8", "meson-python>=0.16", "pybind11>=2.12", "meson>=1.2.3"]
# torch/torchaudio/transformers/onnx are only for scripts/export_align_model.py; the program runs
# the converted ONNX graph through onnxruntime and never imports them
export = ["torch", "torchaudio", "transformers", "onnx"]

[build-system]
requires = ["meson-python>=0.16", "pybind11>=2.12"]
build-backend = "mesonpy"

[tool.uv]
# meson-python rebuilds the extension on import, and meson bakes its own path into build.ninja: under
# build isolation that path points into a temporary build environment that is deleted by then, so the
# build tools have to come from this venv instead
no-build-isolation-package = ["namioto"]
# installing two of the onnxruntime builds would overwrite each other's `onnxruntime` module; uv is
# told they conflict so it refuses the pair instead of producing a broken environment (pip cannot)
conflicts = [[{ extra = "cpu" }, { extra = "cuda" }], [{ extra = "cuda" }, { extra = "webgpu" }]]
# the export group's torch is taken from a mirror of the PyTorch wheel index instead: the build on
# PyPI carries the CUDA libraries, which nothing here uses
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://mirror.sjtu.edu.cn/pytorch-wheels/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
torchaudio = { index = "pytorch-cpu" }

[tool.pytest.ini_options]
testpaths = ["tests"]
# the beat tracker's own tests run the real estimator over 60-90 s of audio, which is most of the
# suite's time; they are there for -m slow, and for a full run pass -m ''
markers = ["slow: measures the beat tracker over minutes of audio"]
addopts = "-m 'not slow'"

[tool.pyright]
venvPath = "."
venv = ".venv"
typeCheckingMode = "basic"
include = ["namioto", "tests", "scripts"]
exclude = ["refs", "build", "dist"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "C4"]
