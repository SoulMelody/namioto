[project]
name = "namioto"
version = "0.1.0"
description = "A WaveTone-style MIDI editor with spectrum assisted transcription"
readme = "README.md"
requires-python = ">=3.12"
license = "AGPL-3.0-only"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "sitiyou" }, { name = "soulmelody" }]
dependencies = [
  "librosa>=1.0",
  "mido>=1.3.3",
  "platformdirs>=4.14.5",
  "pyside6-essentials>=6.12.0",
  "qtawesome>=1.4.2",
  "scipy>=1.18.1",
  "sounddevice>=0.5.6",
  "supriya-midi>=26.10b4",
]

[project.scripts]
namioto = "namioto.ui.app:main"
namioto-cli = "namioto.cli:main"
namioto-ctl = "namioto.ipc:main"

# the runtime the analysis jobs open a model with. `cpu` and `webgpu` share the plain `onnxruntime`
# build, the WebGPU device being a plugin execution provider on top of it, while `cuda` is a build of
# its own; that build provides the same `onnxruntime` module, so it conflicts with both. torch is
# split the same way: the CPU wheel and the CUDA wheel both provide `torch`, so they cannot coexist
[project.optional-dependencies]
ort-cpu = ["onnxruntime>=1.20"]
# CUDA wheels exist for Linux and Windows only. On macOS the marker drops every requirement, so the
# extra resolves as empty instead of being solved for a platform it cannot be installed on.
ort-cuda = [
  "onnxruntime-gpu>=1.20 ; sys_platform != 'darwin'",
  "torch ; sys_platform != 'darwin'",
  "torchaudio ; sys_platform != 'darwin'",
  "muscriptor==0.4.0 ; sys_platform != 'darwin'",
]
ort-webgpu = ["onnxruntime>=1.24.4", "onnxruntime-ep-webgpu"]
# muscriptor 0.4.0 pins numpy<2 on Intel macOS, which librosa cannot accept, and no current torch
# wheel is published for that platform either. Apple Silicon keeps the CPU build.
pytorch-cpu = [
  "torch ; sys_platform != 'darwin' or platform_machine != 'x86_64'",
  "torchaudio ; sys_platform != 'darwin' or platform_machine != 'x86_64'",
  "muscriptor==0.4.0 ; sys_platform != 'darwin' or platform_machine != 'x86_64'",
]

[dependency-groups]
# the analysis jobs need one of the onnxruntime builds and the tests exercise them, but no default
# group may carry one: `uv sync` always includes it, so `--extra ort-cuda`/`ort-webgpu` would install a second
# build over it. Development picks its build with `--extra ort-cpu` (or `--extra ort-cuda`/`--extra ort-webgpu`)
dev = ["pytest>=9.2.0"]
# transformers/onnx are only for scripts/export_align_model.py. torch itself is an extra, because the
# CPU wheel and the CUDA wheel cannot be installed together; this group only adds what an export needs
# on top of whichever torch the chosen extra already brought in
export = ["onnx", "transformers"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["namioto"]

[tool.pyright]
venvPath = "."
venv = ".venv"
typeCheckingMode = "basic"
include = ["namioto", "tests", "scripts"]
exclude = ["refs", "build", "dist"]

[tool.pytest.ini_options]
addopts = "-m 'not slow'"
# the beat tracker's own tests run the real estimator over 60-90 s of audio, which is most of the
# suite's time; they are there for -m slow, and for a full run pass -m ''
markers = ["slow: measures the beat tracker over minutes of audio"]
testpaths = ["tests"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "C4"]

[tool.uv]
# muscriptor 0.4.0 requires numpy<2 on Intel macOS, which librosa cannot accept, and no current torch
# wheel is published for that platform. The lock is solved for the platforms a wheel exists for.
environments = [
  "sys_platform == 'darwin' and platform_machine == 'arm64'",
  "sys_platform == 'linux' and platform_machine == 'x86_64'",
  "sys_platform == 'win32' and platform_machine == 'AMD64'",
]
# told they conflict so it refuses the pair instead of producing a broken environment (pip cannot)
conflicts = [
  [{ extra = "ort-cpu" }, { extra = "ort-cuda" }],
  [{ extra = "ort-cuda" }, { extra = "ort-webgpu" }],
  [{ extra = "pytorch-cpu" }, { extra = "ort-cuda" }],
]

# torch is not on PyPI as one package: the CPU wheel and the CUDA wheel are published on their own
# indexes, and which one a sync takes follows the extra. the CUDA index is the cu128 build line
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://mirror.sjtu.edu.cn/pytorch-wheels/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://mirror.sjtu.edu.cn/pytorch-wheels/cu128"
explicit = true

[tool.uv.sources]
torch = [
  { index = "pytorch-cu128", extra = "ort-cuda" },
  { index = "pytorch-cpu", extra = "pytorch-cpu" },
]
torchaudio = [
  { index = "pytorch-cu128", extra = "ort-cuda" },
  { index = "pytorch-cpu", extra = "pytorch-cpu" },
]
